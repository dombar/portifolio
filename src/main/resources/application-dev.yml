spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/portfolio_db
    username: portfolio
    password: portfolio
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

logging:
  level:
    br.com.portifolio: DEBUG
