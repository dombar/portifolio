spring:
  datasource:
    url: jdbc:h2:mem:portfolio_db;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:
    hikari:
      minimum-idle: 1
      maximum-pool-size: 5
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
  h2:
    console:
      enabled: true
      path: /h2-console

portfolio:
  external-members:
    base-url: http://localhost:8080/api/external
  security:
    username: admin
    password: admin123

logging:
  level:
    br.com.portifolio: DEBUG
    com.zaxxer.hikari: DEBUG
